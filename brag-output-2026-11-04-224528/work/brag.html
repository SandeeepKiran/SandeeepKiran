<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mousy profile brag</title>
<!-- Every frame is a pure function of time. capture.py calls window.renderAt(t) for each frame. -->
<style>
  :root {
    --bg1: #0c1626; --bg2: #10302d; --teal: #2dd4bf; --mint: #99f6e4; --muted: #a7d3cc;
    --gold: #e3c16f; --gold2: #f1d999; --text: #eaf4f1; --card: rgba(12, 24, 38, .82);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg1); }
  body { font-family: "Segoe UI", system-ui, sans-serif; color: var(--text); position: relative; }
  .serif { font-family: Georgia, "Times New Roman", serif; }
  #bgv { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; }
  #veil { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(12,22,38,.25), rgba(12,22,38,.78) 75%); }
  #seeds { position: absolute; inset: 0; }
  #streak { position: absolute; top: 0; left: 0; width: 1400px; height: 1080px; opacity: 0;
            background: linear-gradient(100deg, rgba(153,246,228,0) 30%, rgba(153,246,228,.2) 50%, rgba(241,217,153,.08) 58%, rgba(153,246,228,0) 70%); }
  .scene { position: absolute; inset: 0; opacity: 0; }
  iframe { border: 0; background: transparent; position: absolute; transform-origin: 0 0; }
  .label { font-size: 26px; font-weight: 700; letter-spacing: 8px; color: var(--gold); text-transform: uppercase; }
  .shadow { text-shadow: 0 4px 30px rgba(5, 12, 22, .85); }

  /* Scene 1 */
  #s1url { position: absolute; left: 0; right: 0; top: 780px; text-align: center; font-size: 40px; font-weight: 600; letter-spacing: 3px; color: var(--gold2); }

  /* Scene 2 */
  .row2 { position: absolute; left: 260px; }
  .row2 .big { font-size: 128px; line-height: 1.05; font-weight: 700; }
  .row2 .sub { font-size: 44px; color: var(--mint); font-weight: 600; margin-top: 8px; }
  .yae { background: linear-gradient(120deg, #f2b6c0, #df8894 45%, #c76774); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #blob { position: absolute; width: 640px; left: 1150px; top: 330px; transform-origin: 50% 80%; }
  #sak2 { position: absolute; width: 110px; }

  /* Scene 3 */
  .head { position: absolute; left: 0; right: 0; top: 70px; display: flex; justify-content: center; align-items: center; gap: 22px; }
  .head img { width: 84px; height: 84px; }
  .head span { font-size: 76px; font-weight: 700; }
  .srow { position: absolute; left: 90px; width: 1740px; height: 112px; display: flex; align-items: center; }
  .srow .cat { width: 420px; display: flex; align-items: center; gap: 18px; font-size: 34px; font-weight: 700; flex: none; }
  .srow .cat img { width: 64px; height: 64px; }
  .srow .lane { position: relative; flex: 1; height: 112px; overflow: hidden;
               -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); }
  .srow .track { position: absolute; top: 26px; display: flex; gap: 14px; white-space: nowrap; }
  .pill { padding: 14px 22px; border-radius: 4px; font-size: 22px; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase; color: #fff; box-shadow: 0 6px 18px rgba(0,0,0,.35); }

  /* Scene 4 */
  .card { position: absolute; top: 225px; width: 322px; height: 690px; border-radius: 20px; background: var(--card);
          border: 2px solid rgba(227,193,111,.65); box-shadow: 0 20px 50px rgba(0,0,0,.45), inset 0 0 0 6px rgba(227,193,111,.08);
          padding: 30px 26px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .seal { width: 128px; height: 128px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
          font-size: 68px; font-weight: 700; color: #fff; border: 3px solid var(--gold2); box-shadow: 0 0 0 8px rgba(227,193,111,.15), 0 10px 30px rgba(0,0,0,.4); }
  .card h3 { font-size: 38px; line-height: 1.1; margin-top: 22px; min-height: 130px; justify-content: center; display: flex; align-items: center; }
  .card p { font-size: 23px; line-height: 1.35; color: var(--muted); margin-top: 8px; min-height: 96px; }
  .card .stack { font-size: 17px; font-weight: 700; letter-spacing: 1.5px; color: var(--mint); text-transform: uppercase; margin-top: 10px; line-height: 1.5; }
  .card .cta { margin-top: auto; padding: 12px 18px; border-radius: 6px; background: #b8892b; color: #fff; font-size: 21px; font-weight: 800; letter-spacing: .5px; }
  .card .src { margin-top: 10px; padding: 7px 14px; border-radius: 6px; background: #0f766e; color: #fff; font-size: 17px; font-weight: 700; letter-spacing: 1px; }
  #cursor { position: absolute; width: 54px; z-index: 5; }
  #ring { position: absolute; width: 90px; height: 90px; border-radius: 50%; border: 4px solid var(--gold2); opacity: 0; z-index: 4; }

  /* Scene 5 */
  #s5h { position: absolute; left: 0; right: 0; top: 110px; text-align: center; font-size: 68px; font-weight: 700; }
  #s5h b { color: var(--gold2); }

  /* Scene 6 */
  #s6 .center { position: absolute; left: 0; right: 0; top: 0; height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #s6 .m { font-size: 190px; font-weight: 700; line-height: 1; display: flex; align-items: center; gap: 26px; }
  #s6 .m img { width: 150px; }
  #s6 .line { font-size: 54px; font-weight: 600; margin-top: 34px; }
  #s6 .url { font-size: 42px; font-weight: 600; letter-spacing: 3px; color: var(--gold2); margin-top: 40px; }
  #iso { position: absolute; width: 760px; height: 760px; left: 580px; top: 90px; opacity: .14; }
</style>
</head>
<body>
<video id="bgv" src="assets/anemo.mp4" muted playsinline preload="auto"></video>
<div id="veil"></div>
<canvas id="seeds" width="1920" height="1080"></canvas>

<!-- Scene 1: the real banner from the profile -->
<div class="scene" id="s1">
  <iframe id="banner" src="assets/banner-dark.svg" width="1200" height="300" scrolling="no"></iframe>
  <div id="s1url" class="shadow">github.com/SandeeepKiran</div>
</div>

<!-- Scene 2: who he is -->
<div class="scene" id="s2">
  <div class="row2" id="r2a" style="top:190px">
    <div class="label">By day</div>
    <div class="big serif shadow">QA Manager</div>
    <div class="sub shadow">Tests AI with AI.</div>
  </div>
  <div class="row2" id="r2b" style="top:560px">
    <div class="label">By night</div>
    <div class="big serif yae">Mousy</div>
    <div class="sub shadow">Builds apps he actually uses.</div>
  </div>
  <img id="sak2" src="assets/sakura.png" alt="">
  <img id="blob" src="assets/venti-blob.png" alt="">
</div>

<!-- Scene 3: skill tree, labels and colours copied from README badges -->
<div class="scene" id="s3">
  <div class="head" id="h3"><img src="assets/skills-dark.png" alt=""><span class="serif shadow">Skill tree</span></div>
  <div id="rows3"></div>
</div>

<!-- Scene 4: projects table as cards -->
<div class="scene" id="s4">
  <div class="head" id="h4"><img src="assets/projects-dark.png" alt=""><span class="serif shadow">Projects</span></div>
  <div id="cards"></div>
  <div id="ring"></div>
  <img id="cursor" src="assets/cursor.png" alt="">
  <img src="assets/cursor-pointer.png" alt="" style="display:none">
</div>

<!-- Scene 5: the profile redraws itself -->
<div class="scene" id="s5">
  <div id="s5h" class="serif shadow">Redrawn <b>every night</b> by a GitHub Action.</div>
  <iframe id="snake" src="assets/snake-dark.svg" width="880" height="150" scrolling="no"></iframe>
  <iframe id="stats" src="assets/stats-dark.svg" width="460" height="270" scrolling="no"></iframe>
  <iframe id="activity" src="assets/activity-dark.svg" width="460" height="270" scrolling="no"></iframe>
</div>

<!-- Scene 6: outro -->
<div class="scene" id="s6">
  <img id="iso" src="assets/isotoma-dark.png" alt="">
  <div class="center">
    <div class="m"><img id="sak6" src="assets/sakura.png" alt=""><span class="serif yae">Mousy</span></div>
    <div class="line shadow" id="l6">Built for himself. Tested like production.</div>
    <div class="url shadow" id="u6">github.com/SandeeepKiran</div>
  </div>
</div>

<div id="streak"></div>

<script>
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (x) => 1 - Math.pow(1 - x, 3);
const eInOut = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = (x) => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;

// Scene times (seconds). One beat = 0.6 s at 100 BPM.
const S = [[0, 3.0], [3.0, 6.6], [6.6, 10.2], [10.2, 16.8], [16.8, 19.8], [19.8, 23.4]];
const CUTS = [3.0, 6.6, 10.2, 16.8, 19.8];
const END = 23.4;

// Scene opacity: old content out (0.25 s) before the cut, new content in (0.3 s) after it.
function vis(t, i) {
  const [a, b] = S[i];
  const fin = i === 0 ? 1 : seg(t, a, a + 0.3);
  const fout = i === S.length - 1 ? 1 - seg(t, END - 0.35, END) : 1 - seg(t, b - 0.25, b);
  return t < a - 0.01 || t > b + 0.01 ? 0 : Math.min(fin, fout);
}

// ---------- build static DOM ----------
const SKILLS = [
  ["AI & LLMs", "ai", "#134e4a", "#fff", ["Claude Code", "Claude API", "ChatGPT", "Codex", "Gemini", "Cursor", "MCP", "Prompt Engineering", "LLM Evaluation", "Agentic Workflows"]],
  ["AI Evaluation", "ai-eval", "#b8892b", "#fff", ["DeepEval", "LLM-as-Judge", "RAG", "Hallucination & Groundedness", "Synthetic Test Data", "Agents & Chatbots", "AI Safety", "Prompt Injection"]],
  ["Testing", "testing", "#0f766e", "#fff", ["Test Strategy", "Regression", "Smoke", "Functional", "UAT", "API", "NLU & Intent", "Voice AI (ASR, TTS)", "pytest", "Playwright", "Postman"]],
  ["Tech & Tools", "tech", "#335c81", "#fff", ["Python", "TypeScript", "Kotlin", "VBA", "Next.js", "REST", "Git", "GitLab", "CI/CD", "Jira", "Confluence", "Excel", "KPI & KRA Reporting"]],
  ["Domains", "domains", "#d9b25f", "#13202a", ["Banking", "Insurance", "Healthcare", "ITSD", "E-commerce", "Telecom", "EdTech", "Retail", "Travel"]],
];
const rows3 = $("rows3");
SKILLS.forEach(([name, icon, bg, fg, list], i) => {
  const pills = list.map((s) => `<span class="pill" style="background:${bg};color:${fg}">${s.replace(/&/g, "&amp;")}</span>`).join("");
  rows3.insertAdjacentHTML("beforeend",
    `<div class="srow" id="sr${i}" style="top:${235 + i * 150}px"><div class="cat shadow"><img src="assets/${icon}-dark.png" alt="">${name.replace(/&/g, "&amp;")}</div>` +
    `<div class="lane"><div class="track" id="tr${i}">${pills}${pills}${pills}</div></div></div>`);
});

const PROJECTS = [
  ["Kitsune Labs", "QA tools in the browser: test generation, bug finding and reports", "TypeScript · Vite · LLM APIs", "▶ Try it live", "K", "linear-gradient(135deg,#a17ae0,#5b34a6)"],
  ["Windfall Gallery", "Android gallery that shows your photos and videos in random order", "Kotlin · Jetpack Compose · Media3", "⬇ Download APK", "W", "linear-gradient(135deg,#5eead4,#0f766e)"],
  ["My Personal UX for Amazon", "Browser extension that cleans up Amazon pages", "JavaScript · MV3 · Chrome, Edge, Firefox", "⬇ Get the extension", "A", "linear-gradient(135deg,#f1d999,#b8892b)"],
  ["Leyline Autofill", "AI autofill for job application forms. You review, it never submits", "JavaScript · MV3 · GPT and Claude APIs", "⬇ Get the extension", "L", "linear-gradient(135deg,#a5d65a,#4f8a2b)"],
  ["Sandstorm Secure", "Phone security and device management", "Python · FastAPI · Android Management API", "▶ Watch demo", "S", "linear-gradient(135deg,#f0a86b,#ce5818)"],
];
const CARD_X = (i) => 104 + i * (322 + 28);
const cardsEl = $("cards");
PROJECTS.forEach(([name, what, stack, cta, letter, grad], i) => {
  cardsEl.insertAdjacentHTML("beforeend",
    `<div class="card" id="c${i}" style="left:${CARD_X(i)}px"><div class="seal serif" style="background:${grad}">${letter}</div>` +
    `<h3 class="serif">${name}</h3><p>${what}</p><div class="stack">${stack}</div>` +
    `<div class="cta" id="cta${i}">${cta}</div><div class="src">SOURCE</div></div>`);
});

// ---------- dandelion seeds (deterministic) ----------
const ctx = $("seeds").getContext("2d");
let seed = 11;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const SEEDS = Array.from({ length: 34 }, () => ({ x: rnd() * 1920, y: rnd() * 1080, v: 40 + rnd() * 70, r: 4 + rnd() * 6, ph: rnd() * 6.28, a: .25 + rnd() * .45 }));
function drawSeeds(t) {
  ctx.clearRect(0, 0, 1920, 1080);
  for (const s of SEEDS) {
    const x = ((s.x + t * s.v * 1.6) % 2100) - 90;
    const y = ((s.y - t * s.v * .45 + Math.sin(t * .9 + s.ph) * 30) % 1180 + 1180) % 1180 - 50;
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(t + s.ph) * .5); ctx.globalAlpha = s.a;
    ctx.strokeStyle = "#f4f1e6"; ctx.lineWidth = 1.2;
    for (let k = 0; k < 7; k++) { const ang = -Math.PI / 2 + (k - 3) * .32; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(ang) * s.r * 2.2, Math.sin(ang) * s.r * 2.2); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, s.r * 2); ctx.stroke();
    ctx.fillStyle = "#f4f1e6"; ctx.beginPath(); ctx.arc(0, 0, 1.6, 0, 6.28); ctx.fill();
    ctx.restore();
  }
}

// ---------- SVG time control ----------
function svgDoc(id) { try { return $(id).contentDocument; } catch (e) { return null; } }
function setSvgTime(id, sec) {
  const d = svgDoc(id); if (!d || !d.documentElement) return;
  const svg = d.documentElement;
  if (svg.pauseAnimations) { svg.pauseAnimations(); svg.setCurrentTime(sec); }
  if (d.getAnimations) for (const a of d.getAnimations()) { a.pause(); a.currentTime = sec * 1000; }
}

const set = (el, o, tf) => { el.style.opacity = o; if (tf !== undefined) el.style.transform = tf; };

function render(t) {
  drawSeeds(t);

  // Wind streak sweeps across each cut.
  const st = $("streak");
  let so = 0, sx = -1000;
  for (const c of CUTS) { const p = seg(t, c - 0.35, c + 0.35); if (p > 0 && p < 1) { so = Math.sin(p * Math.PI); sx = lerp(-1400, 1920, eInOut(p)); } }
  st.style.opacity = so; st.style.transform = `translateX(${sx}px)`;

  for (let i = 0; i < 6; i++) $("s" + (i + 1)).style.opacity = vis(t, i);

  // Scene 1: banner flies in (scale 1.4 -> 1.32), blur clears.
  {
    const p = eOut(seg(t, 0, 0.9));
    const sc = lerp(1.62, 1.36, p) + t * 0.01;
    const b = $("banner");
    b.style.opacity = p;
    b.style.filter = `blur(${(1 - p) * 14}px) drop-shadow(0 30px 60px rgba(0,0,0,.5))`;
    b.style.left = (960 - 600 * sc) + "px"; b.style.top = (500 - 150 * sc - (1 - p) * 40) + "px";
    b.style.transform = `scale(${sc})`;
    setSvgTime("banner", 4 + t);
    const u = eOut(seg(t, 1.0, 1.5));
    set($("s1url"), u, `translateY(${(1 - u) * 24}px)`);
  }

  // Scene 2: two rows rise in on the beat.
  if (t > 2.9 && t < 6.7) {
    const a = eOut(seg(t, 3.15, 3.65)), b = eOut(seg(t, 3.95, 4.45));
    set($("r2a"), a, `translateX(${(1 - a) * -60}px)`);
    set($("r2b"), b, `translateX(${(1 - b) * -60}px)`);
    const bl = eBack(seg(t, 3.3, 3.9));
    $("blob").style.opacity = clamp(bl * 1.5);
    $("blob").style.transform = `translateY(${(1 - bl) * 120 + Math.sin(t * 3.2) * 10}px) rotate(${Math.sin(t * 5.2) * 4}deg) scale(${.8 + .2 * bl})`;
    const sk = $("sak2"); sk.style.left = "730px"; sk.style.top = "605px";
    sk.style.opacity = b; sk.style.transform = `rotate(${(1 - b) * -90 + Math.sin(t * 2) * 6}deg) scale(${.5 + .5 * b})`;
  }

  // Scene 3: rows slide in one by one, badges drift in alternating directions.
  if (t > 6.5 && t < 10.3) {
    const h = eOut(seg(t, 6.75, 7.2)); set($("h3"), h, `translateY(${(1 - h) * -30}px)`);
    SKILLS.forEach((_, i) => {
      const p = eOut(seg(t, 6.9 + i * 0.15, 7.4 + i * 0.15));
      set($("sr" + i), p, `translateX(${(1 - p) * 120}px)`);
      const tr = $("tr" + i);
      const w = tr.scrollWidth / 3;
      const dir = i % 2 ? 1 : -1;
      const off = ((t - 6.6) * 70 * dir) % w;
      tr.style.transform = `translateX(${-w * 0.35 + off}px)`;
    });
  }

  // Scene 4: cards deal in on the eighth notes, cursor clicks "Try it live".
  if (t > 10.1 && t < 16.9) {
    const h = eOut(seg(t, 10.35, 10.8)); set($("h4"), h, `translateY(${(1 - h) * -30}px)`);
    const click = 14.7;
    PROJECTS.forEach((_, i) => {
      const t0 = 10.5 + i * 0.3;
      const p = eBack(seg(t, t0, t0 + 0.55));
      const o = clamp(seg(t, t0, t0 + 0.2));
      let lift = 0, glow = 0;
      if (i === 0) { lift = eOut(seg(t, click, click + 0.35)) * 26; glow = seg(t, click, click + 0.3); }
      const c = $("c" + i);
      c.style.opacity = o;
      c.style.transform = `translateY(${(1 - p) * 260 - lift}px) rotate(${(1 - p) * (i - 2) * 4}deg) scale(${1 + glow * 0.03})`;
      c.style.boxShadow = `0 20px 50px rgba(0,0,0,.45), 0 0 ${glow * 60}px rgba(241,217,153,${glow * .55}), inset 0 0 0 6px rgba(227,193,111,.08)`;
      c.style.borderColor = i === 0 && glow > 0 ? `rgba(241,217,153,${.65 + .35 * glow})` : "rgba(227,193,111,.65)";
    });
    // Cursor glides from the right edge over all cards to Kitsune Labs' button.
    const tx = CARD_X(0) + 161 + 58, ty = 225 + 690 - 30 - 34 - 10 - 23 + 4; // centre of the CTA button
    const m = eInOut(seg(t, 12.9, 14.45));
    const cx = lerp(1980, tx, m), cy = lerp(1020, ty, m) - Math.sin(m * Math.PI) * 140;
    const press = seg(t, click - 0.08, click) * (1 - seg(t, click + 0.06, click + 0.2));
    const cur = $("cursor");
    cur.src = t > 14.3 ? "assets/cursor-pointer.png" : "assets/cursor.png";
    cur.style.opacity = clamp(seg(t, 12.9, 13.1)) * (1 - seg(t, 16.3, 16.55));
    cur.style.left = cx + "px"; cur.style.top = (cy - (t > click ? eOut(seg(t, click, click + 0.35)) * 26 : 0)) + "px";
    cur.style.transform = `scale(${1 - press * 0.15})`;
    const rp = seg(t, click, click + 0.6);
    const ring = $("ring");
    ring.style.opacity = rp > 0 && rp < 1 ? (1 - rp) : 0;
    ring.style.left = (tx - 45) + "px"; ring.style.top = (ty - 45 - 26 * eOut(seg(t, click, click + 0.35))) + "px";
    ring.style.transform = `scale(${0.4 + rp * 1.6})`;
    $("cta0").style.background = t > click ? "#d9a73a" : "#b8892b";
  }

  // Scene 5: headline, then the real snake and stats cards.
  if (t > 16.7 && t < 19.9) {
    const h = eOut(seg(t, 16.95, 17.4)); set($("s5h"), h, `translateY(${(1 - h) * 30}px)`);
    const sn = $("snake"), sc = 1.85;
    const p = eOut(seg(t, 17.2, 17.7));
    sn.style.left = (960 - 880 * sc / 2) + "px"; sn.style.top = (270 + (1 - p) * 40) + "px";
    sn.style.opacity = p; sn.style.transform = `scale(${sc})`;
    setSvgTime("snake", 4.2 + (t - 16.8) * 1.6);
    [["stats", 520], ["activity", 1400]].forEach(([id, cxp], k) => {
      const q = eOut(seg(t, 17.45 + k * 0.15, 17.95 + k * 0.15));
      const el = $(id), s2 = 1.08;
      el.style.left = (cxp - 460 * s2 / 2) + "px"; el.style.top = (690 + (1 - q) * 60) + "px";
      el.style.opacity = q; el.style.transform = `scale(${s2})`;
    });
  }

  // Scene 6: outro.
  if (t > 19.7) {
    const m = eBack(seg(t, 19.95, 20.55));
    set($("s6").querySelector(".m"), clamp(seg(t, 19.95, 20.25)), `scale(${.85 + .15 * m})`);
    $("sak6").style.transform = `rotate(${Math.sin(t * 1.6) * 8 - (1 - m) * 60}deg)`;
    const l = eOut(seg(t, 20.25, 20.7)); set($("l6"), l, `translateY(${(1 - l) * 24}px)`);
    const u = eOut(seg(t, 20.55, 21.0)); set($("u6"), u, `translateY(${(1 - u) * 24}px)`);
    $("iso").style.transform = `rotate(${t * 12}deg) scale(${.9 + .1 * eOut(seg(t, 19.8, 21))})`;
  }
}

// Seek the background video, render, and wait two frames so everything is painted.
const vid = $("bgv");
window.renderAt = async (t) => {
  const vt = (t * 0.9) % 7.9;
  if (Math.abs(vid.currentTime - vt) > 0.001) {
    await new Promise((res) => { vid.addEventListener("seeked", res, { once: true }); vid.currentTime = vt; });
  }
  render(t);
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  return true;
};
window.ready = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map((im) => im.complete ? 1 : new Promise((r) => { im.onload = im.onerror = r; })));
  await Promise.all([...document.querySelectorAll("iframe")].map((f) => f.contentDocument && f.contentDocument.readyState === "complete" ? 1 : new Promise((r) => f.addEventListener("load", r, { once: true }))));
  if (vid.readyState < 2) await new Promise((r) => vid.addEventListener("loadeddata", r, { once: true }));
  return true;
})();
</script>
</body>
</html>
